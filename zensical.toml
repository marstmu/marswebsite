[project]
site_name = "MARS"
site_url = "https://marstmu.com/"
site_description = "Metropolitan Aerospace Rocket Society at Toronto Metropolitan University: student model rocketry, hands-on learning, and competition."
site_author = "MARS"
repo_url = "https://github.com/marstmu/marswebsite"
edit_uri = "edit/main/docs/"
copyright = "Metropolitan Airspace Rocket Society © 2026"
docs_dir = "docs"
site_dir = "site"
dev_addr = "127.0.0.1:8887"
use_directory_urls = true
extra_css = ["css/mars.css", "css/mars-shell.css"]
extra_javascript = ["javascripts/mars-shell.js", "javascripts/mathjax.js"]
nav = [
  { "Home" = "index.md" },
  { "Competition" = "competition/index.md" },
  { "Guides" = [
    { "Learn" = "learn.md" },
    { "2024–2025 archive" = [
      { "Rocket guide" = "Guidelines/Archive/2024-2025/Rocket-Guide.md" },
      { "Avionics" = "Guidelines/Archive/2024-2025/Avionics-Guide/index.md" },
      { "Avionics kits" = "Guidelines/Archive/2024-2025/Avionics-Guide/kits/index.md" },
      { "Flight computer" = "Guidelines/Archive/2024-2025/Avionics-Guide/flight-computer/index.md" },
      { "Ground station" = "Guidelines/Archive/2024-2025/Avionics-Guide/ground-station/index.md" },
    ] },
  ] },
  { "Philosophy" = "philosophy/index.md" },
  { "Blog" = "blog/index.md" },
  { "Gallery" = "gallery.md" },
  { "Resources" = "links-and-resources.md" },
]

[project.theme]
variant = "modern"
custom_dir = "overrides"
logo = "img/mars-horizontal-transparent.png"
favicon = "img/favicon.ico"
features = [
  "content.code.copy", "navigation.indexes", "toc.follow",
]
palette = [
  { media = "(prefers-color-scheme: light)", primary = "custom", scheme = "default" },
  { media = "(prefers-color-scheme: dark)", primary = "custom", scheme = "slate" },
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.plugins.exclude]
glob = [".*/**", ".*", "Guidelines/How-To-Contribute-To-Your-Docs/**", "Guidelines/Website-Notes/**"]

[project.plugins.blog]
blog_dir = "blog"
post_url_date_format = "yyyy/MM/dd"
post_url_format = "{date}/{slug}"

[project.plugins.search]
enabled = false

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
"pymdownx.emoji" = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }
"pymdownx.tasklist" = { custom_checkbox = true }
"pymdownx.highlight" = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
"pymdownx.inlinehilite" = {}
"pymdownx.snippets" = {}
"pymdownx.superfences" = {}
"pymdownx.caret" = {}
"pymdownx.mark" = {}
"pymdownx.tilde" = {}
"pymdownx.arithmatex" = { generic = true }

[project.extra]
generator = true
social = [
  { icon = "fontawesome/brands/github", name = "GitHub", link = "https://github.com/marstmu/" },
  { icon = "fontawesome/brands/instagram", name = "Instagram", link = "https://www.instagram.com/mars.tmu/" },
  { icon = "fontawesome/brands/linkedin", name = "LinkedIn", link = "https://www.linkedin.com/company/marstmu/" },
  { icon = "fontawesome/brands/discord", name = "Discord", link = "https://discord.com/invite/BaQZkd2TKj" },
  { icon = "simple/notion", name = "Notion", link = "https://marstmu.notion.site/MARS-Notion-1912fcb069e2804d92e6dc49248b4dbb" },
]
